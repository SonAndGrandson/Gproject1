
services:
  db:
    image: postgres:17
    container_name: uptime-postgres
    environment:
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: uptime_monitor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://monitor_user:local_dev_password@db:5432/uptime_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  worker:
    build: ./api
    command:
      - python
      - -m
      - celery
      - -A
      - tasks:celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
    environment:
      DATABASE_URL: postgresql://monitor_user:local_dev_password@db:5432/uptime_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    build: ./api
    command:
      - python
      - -m
      - celery
      - -A
      - tasks:celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql://monitor_user:local_dev_password@db:5432/uptime_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
